[project]
name = "VoiceVault"
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "aiogram>=3.15.0",
    "alembic>=1.18.0",
    "asyncpg>=0.31.0",
    "broker>=0.8.11",
    "clean-text>=0.7.1",
    "field>=0.2.0",
    "greenlet>=3.3.0",
    "httpx>=0.28.1",
    "prometheus-client>=0.21.1",
    "psycopg[binary]>=3.3.4",
    "psycopg-pool>=3.3.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.12.0",
    "qdrant-client>=1.12.0",
    "redis>=5.3.1",
    "sqlalchemy[asyncio]>=2.0.45",
    "taskiq>=0.11.0",
    "taskiq-aio-pika>=0.4.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "polyfactory>=3.2.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.2",
    "types-aiofiles>=25.1.0.20260518",
    "types-redis>=4.6.0.20241004",
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py312"
preview = true
extend-exclude = [
    "migrations",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "D",
    "DOC"
]
ignore = [
    "B008",
    "D100",
    "D104",
    "D106",
    "D107",
    "T20",
    "TRY",
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
mypy_path = "src"
explicit_package_bases = true

plugins = [
    "pydantic.mypy"
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = [
    "asyncpg.*",
    "qdrant_client.*",
    "aiogram.*",
    "prometheus_client",
    "prometheus_client.*",
]
ignore_missing_imports = true
disallow_untyped_decorators = false
disallow_subclassing_any = false
