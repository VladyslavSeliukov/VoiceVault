services:

  bot:
    build: .
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - voicevault
    volumes:
      - ./storage:/app/storage
      - obsidian_vault:${OBSIDIAN_DIR}

  redis:
    image: redis:8
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - voicevault

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_port_connectivity" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voicevault
    restart: unless-stopped

  worker:
    build: .
    container_name: worker
    command: taskiq worker worker:broker --workers 1
    env_file: .env
    volumes:
      - obsidian_vault:${OBSIDIAN_DIR}
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - voicevault
    restart: unless-stopped

  scheduler:
    build: .
    container_name: scheduler
    command: taskiq scheduler worker:scheduler
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - voicevault
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: postgres -c shared_buffers=256MB -c max_connections=200
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - voicevault

  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - voicevault

