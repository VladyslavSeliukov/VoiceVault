services:

  bot:
    build: .
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - voicevault
    volumes:
      - ./storage:/app/storage
      - obsidian_vault:${OBSIDIAN_DIR}

  redis:
    image: redis:8
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - voicevault

  rabbitmq:
    image: rabbitmq:4-management
    container_name: voicevault_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_port_connectivity" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voicevault
    restart: unless-stopped

  worker:
    build: .
    container_name: worker
    command: taskiq worker core.broker:broker modules.voice.tasks worker
    env_file: .env
    volumes:
      - obsidian_vault:${OBSIDIAN_DIR}
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - voicevault
    restart: unless-stopped

  scheduler:
    build: .
    container_name: scheduler
    command: taskiq scheduler worker:scheduler modules.voice.tasks
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - voicevault
    restart: unless-stopped

