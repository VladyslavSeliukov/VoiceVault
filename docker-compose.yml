services:

  #     ── Phase 1+ ── main bot process (aiogram polling)
  bot:
    build: .
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - voicevault
    volumes:
      - ./storage:/app/storage

  #     ── Phase 6+ ── uncomment once RabbitMQ tasks exist
  #     worker:
  #       build: .
  #       command: ["taskiq", "worker", "services.tasks:broker"]
  #       env_file: .env
  #       volumes:
  #         - obsidian_vault:/vault
  #       depends_on:
  #         rabbitmq:
  #           condition: service_healthy
  #         postgres:
  #           condition: service_healthy
  #       networks:
  #         - voicevault
  #
  #     ── Phase 4+ ── needed once you start persisting note metadata
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: voicevault
      POSTGRES_PASSWORD: voicevault
      POSTGRES_DB: voicevault
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U voicevault" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - voicevault

  #     ── Phase 1+ ── needed for FSM storage + debounce timer
  redis:
    image: redis:8
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - voicevault

