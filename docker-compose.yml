networks:
  voicevault:

volumes:
  # grafana_data:
  qdrant_data:
  postgres_data:
  rabbitmq_data:
  redis_data:
  obsidian_vault:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOST_OBSIDIAN_DIR}
