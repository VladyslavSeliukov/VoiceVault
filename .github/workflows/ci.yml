name: VoiceVault CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv and setup Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Run Ruff (lint)
        run: uv run ruff check .

      - name: Run Ruff (format check)
        run: uv run ruff format --check .

      - name: Run mypy
        run: uv run mypy .

  test:
    name: Run Pytest with Coverage
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testvault
          POSTGRES_PASSWORD: testvault
          POSTGRES_DB: testvault
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:4-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics check_port_connectivity"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports:
          - 6333:6333
        options: >-
          --health-cmd "wget -qO- http://localhost:6333/readyz || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: "test"
      LOG_LEVEL: "INFO"

      BOT_TOKEN: "test_token_for_ci"

      VOICES_DIR: "storage/voices"

      WHISPER_CPP_DIR: "/path/to/your/whisper.cpp"
      WHISPER_MODEL: "ggml-base.bin"
      WHISPER_PORT: 8080
      WHISPER_HOST: "localhost"

      HOST_OBSIDIAN_DIR: "/path/to/your/obsidian/folder"
      OBSIDIAN_DIR: "/app/storage/obsidian"

      OLLAMA_API_BASE: "http://localhost:1234/api"
      LLM_MODEL: "test-9b-llm"
      LLM_NUM_CTX: 4096
      EMBEDDING_MODEL: "your-embedding:0.6b"
      OLLAMA_KEEP_ALIVE: "5m"

      WHISPER_TIMEOUT: 120.0
      OLLAMA_TIMEOUT_EMBEDDING: 30.0
      OLLAMA_TIMEOUT_LLM: 120.0

      REDIS_URL: "redis://localhost:6379/0"
      FLUSH_TIMEOUT_MINUTES: 60
      IDEMPOTENCY_TTL_SECONDS: 86400

      RABBITMQ_USER: "guest"
      RABBITMQ_PASS: "guest"
      RABBITMQ_URL: "amqp://guest:guest@localhost:5672/"

      POSTGRES_USER: "testvault"
      POSTGRES_PASSWORD: "testvault"
      POSTGRES_DB: "testvault"
      POSTGRES_HOST: "localhost"
      POSTGRES_PORT: 5432
      POSTGRES_URL: "postgresql+asyncpg://testvault:testvault@localhost:5432/testvault"

      QDRANT_HOST: "localhost"
      QDRANT_PORT: 6333
      QDRANT_COLLECTION_NAME: "obsidian_notes"
      QDRANT_VECTOR_SIZE: 1536
      QDRANT_SEARCH_LIMIT: 3
      QDRANT_SCORE_THRESHOLD: 0.5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv and setup Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Run Pytest with Coverage
        run: uv run pytest -v --cov=src --cov-report=term-missing
