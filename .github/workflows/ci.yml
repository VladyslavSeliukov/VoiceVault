    env:
      ENVIRONMENT: "test"
      LOG_LEVEL: "INFO"

      BOT_TOKEN: "test_token_for_ci"

      VOICES_DIR: "storage/voices"

      WHISPER_CPP_DIR: "/path/to/your/whisper.cpp"
      WHISPER_MODEL: "ggml-base.bin"

      WHISPER_PORT: 8080
      WHISPER_HOST: "host.docker.internal"

      HOST_OBSIDIAN_DIR: "/path/to/your/obsidian/folder"
      OBSIDIAN_DIR: "/app/storage/obsidian"

      OLLAMA_API_BASE: "http://testhost:1234/v1"
      LLM_MODEL: "test-9b-llm"
      LLM_NUM_CTX: 4096
      EMBEDDING_MODEL: "your-embedding:0.6b"
      OLLAMA_KEEP_ALIVE: "5m"

      REDIS_URL: "redis://localhost:6379/0"
      FLUSH_TIMEOUT_MINUTES: 60
      IDEMPOTENCY_TTL_SECONDS: 86400

      RABBITMQ_USER: "guest"
      RABBITMQ_PASS: "guest"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"

      POSTGRES_USER: "testvault"
      POSTGRES_PASSWORD: "testvault"
      POSTGRES_DB: "testvault"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: 5432

      POSTGRES_URL: "postgresql+psycopg://testvault:testvault@testvault:5432/testvault"


      QDRANT_HOST: "qdrant"
      QDRANT_PORT: 6333
      QDRANT_COLLECTION_NAME: "obsidian_notes"
      QDRANT_VECTOR_SIZE: 1024

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv and setup Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Run Pytest
        run: uv run pytest -v
