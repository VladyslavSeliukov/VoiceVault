global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'voicevault_bot'
    static_configs:
      - targets: [ 'bot:9090' ]

  - job_name: 'voicevault_worker'
    static_configs:
      - targets: [ 'worker:9091' ]

  - job_name: 'rabbitmq'
    static_configs:
      - targets: [ 'rabbitmq:15692' ]
